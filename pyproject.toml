[project]
name = "youtube-music-downloader"
version = "0.1.0"
description = "A web application for downloading and converting YouTube videos to MP3 files with metadata"
requires-python = ">=3.8"
dependencies = [
    "yt-dlp==2024.5.27",
    "ffmpeg==1.4",
    "eyed3==0.9.7",
    "wget==3.2",
    "flask[async]==3.0.3",
    "flask-cors==4.0.1", 
    "requests==2.32.3",
    "lxml==5.2.2",
    "cssselect==1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"