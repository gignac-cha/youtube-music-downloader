# Workspace root configuration - not a package itself
[tool.uv.workspace]
members = ["packages/downloader", "packages/server"]
# packages/ui is excluded as it's a TypeScript project

[tool.uv]
dev-dependencies = [
    "ruff>=0.14.5",
    "mypy>=1.18.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "coverage[toml]>=7.11.0",
    "bandit[toml]>=1.7.0",
    "pre-commit>=4.0.0",
]

# ===== RUFF =====
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "packages/ui",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "S",   # flake8-bandit (security)
]

ignore = [
    "S301",  # Allow pickle (used by yt-dlp)
    "S603",  # Allow subprocess without shell=True validation
    "S607",  # Allow subprocess with partial path
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG"]  # Allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===== MYPY =====
[tool.mypy]
python_version = "3.11"
strict = false  # Will enable gradually
show_error_codes = true
show_column_numbers = true
pretty = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Will enable after adding type hints
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "flask.*",
    "yt_dlp.*",
    "eyed3.*",
    "wget.*",
]
ignore_missing_imports = true

# ===== PYTEST =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-v",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ===== COVERAGE =====
[tool.coverage.run]
source = ["packages"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

# ===== BANDIT =====
[tool.bandit]
exclude_dirs = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "tests",
    "build",
    "dist",
    "packages/ui",
]
