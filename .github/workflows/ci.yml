name: CI

on:
  push:
    branches: [main, develop, refactor/**]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync

      - name: Run Ruff (lint)
        run: uv run ruff check packages/

      - name: Run Ruff (format check)
        run: uv run ruff format --check packages/

      - name: Run mypy
        run: uv run mypy packages/ --ignore-missing-imports
        continue-on-error: true  # Will enforce after adding type hints

      - name: Run pytest with coverage
        run: |
          uv run pytest --cov=packages --cov-report=xml --cov-report=term
        continue-on-error: true  # Will enforce after adding tests

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run Bandit security scan
        run: uv run bandit -r packages/ -c pyproject.toml
        continue-on-error: true  # Will enforce after addressing security issues
