[project]
name = "youtube-music-server"
version = "0.2.0"
description = "FastAPI REST API server for YouTube music downloader"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.32.5",
    "lxml>=6.0.2",
    "typer>=0.20.0",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "youtube-downloader",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
]

[tool.uv.sources]
youtube-downloader = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
