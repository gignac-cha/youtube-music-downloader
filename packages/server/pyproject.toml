[project]
name = "youtube-music-server"
version = "0.1.0"
description = "Flask REST API server for YouTube music downloader"
requires-python = ">=3.11"
dependencies = [
    "flask[async]>=3.1.2",
    "requests>=2.32.5",
    "lxml>=6.0.2",
    "typer>=0.20.0",
    "youtube-downloader",
]

[tool.uv.sources]
youtube-downloader = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
