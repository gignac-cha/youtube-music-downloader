[project]
name = "youtube-downloader"
version = "0.1.0"
description = "Core YouTube video download and conversion functionality"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.11.12",
    "eyed3>=0.9.8",
    "wget>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
